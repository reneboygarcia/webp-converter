name: CI (Test + SCA + SBOM)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

  trivy:
    name: Trivy scan & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          # Fails the build if CRITICAL or HIGH vulnerabilities are found
          trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 .

      - name: Generate CycloneDX SBOM
        run: |
          trivy fs -f cyclonedx -o sbom.cyclonedx.json .

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
