name: CI (Test + SCA + SBOM)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# Set default permissions to read-only for security
permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

  trivy:
    name: Trivy scan & SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to Code Scanning

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@a85c5457f9754f9a56d9573887e5084931f6d376 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          # Fails the build if CRITICAL or HIGH vulnerabilities are found
          trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 1 .

      - name: Generate Trivy SARIF report
        if: always()
        run: |
          trivy fs --format sarif --output trivy-results.sarif --scanners vuln .

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@a0a7f745e7f0951167425f16e61916b9b3e1250b # v3.26.1
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate CycloneDX SBOM
        run: |
          trivy fs -f cyclonedx -o sbom.cyclonedx.json .

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

