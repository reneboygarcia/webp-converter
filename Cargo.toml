[package]
name = "webp-converter"
version = "0.2.0"
edition = "2021"
description = "A CLI tool to convert images to WebP format — Rust rewrite"
authors = ["reneboygarcia"]
default-run = "webp-convert"

[[bin]]
name = "webp-convert"
path = "src/main.rs"

[lib]
name = "webp_converter"
path = "src/lib.rs"

[dependencies]
clap      = { version = "4.5", features = ["derive"] }
inquire   = "0.7"
indicatif = "0.17"
console   = "0.15"
dirs      = "5.0"
image     = { version = "0.25", features = ["png", "jpeg", "bmp", "tiff", "gif"] }
webp      = "0.3"
rayon     = "1.10"
walkdir   = "2.5"
thiserror = "1.0"
anyhow    = "1.0"

[dev-dependencies]
tempfile = "3.10"
